<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新标签页设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="settings">
    <h1>新标签页设置</h1>
    <p class="description">设置打开新标签页时访问的地址和跳转行为。</p>
    <label class="checkbox-label"><input id="new-tab-enabled" type="checkbox"> 启用新标签页跳转</label>
    <label for="new-tab-url">新标签页地址</label>
    <input id="new-tab-url" type="url" autocomplete="url" spellcheck="false" placeholder="https://panel.yiniot.com">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="save" type="button">保存</button>
      <button id="reset" class="secondary" type="button">恢复默认</button>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="settings.js"></script>
</body>
</html>
